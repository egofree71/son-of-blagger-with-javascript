<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Son of Blagger</title>

    <!--
        PWA metadata. The relative paths keep the build installable when hosted
        from a GitHub Pages project URL instead of the domain root.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Son of Blagger" />

    <!--
        Phaser 4 is imported from npm by Vite through src/main.ts.
    -->
    <script type="module" src="/src/main.ts"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /*
            In fullscreen PWA mode, Android may expose the cutout/status-bar
            area around the camera. Keeping the page, container and canvas
            gutters black avoids a light strip at the left or right edge in
            landscape orientation.

            Samsung Internet can still reserve the cutout as a safe-area strip
            in installed PWAs. Extending the fixed game container by the safe
            area insets lets the black gutters cover that strip too, matching
            the browser fullscreen look without changing the game's 640x400
            logical resolution.
        */
        #game-container {
            position: fixed;
            top: calc(0px - env(safe-area-inset-top, 0px));
            right: calc(0px - env(safe-area-inset-right, 0px));
            bottom: calc(0px - env(safe-area-inset-bottom, 0px));
            left: calc(0px - env(safe-area-inset-left, 0px));
            width: auto;
            height: auto;
            min-width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            touch-action: none;
            background: #000;
        }

        canvas {
            display: block;
            background: #c0c0c0;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
</body>
</html>
